<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>Câmera</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    /* O <video> é desenhado numa camada própria e ignora o overflow:hidden do pai,
       então o recorte (clip-path) é aplicado no próprio vídeo e no contêiner. */
    #frame {
      position: absolute; inset: 0; overflow: hidden; cursor: grab;
      background: #111; --clip: circle(50% at 50% 50%); --radius: 50%;
      clip-path: var(--clip); border-radius: var(--radius);
    }
    body.shape-rounded #frame { --clip: inset(0 round 18px); --radius: 18px; }
    body.dragging #frame { cursor: grabbing; }
    video {
      width: 100%; height: 100%; object-fit: cover; display: block;
      clip-path: var(--clip); border-radius: var(--radius);
    }
    #frame::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      border: 3px solid rgba(255, 255, 255, .85); border-radius: var(--radius); box-sizing: border-box;
    }
    body.mirror video { transform: scaleX(-1); }
    #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #bbb; font: 13px "Segoe UI", sans-serif; text-align: center; padding: 12px; pointer-events: none; }
    #resize {
      position: absolute; right: 2px; bottom: 2px; width: 22px; height: 22px; cursor: nwse-resize;
      opacity: 0; transition: opacity .15s;
      background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.9) 50%);
      border-radius: 0 0 6px 0;
    }
    body.shape-circle #resize { right: 14%; bottom: 14%; border-radius: 4px; }
    body:hover #resize { opacity: 1; }
  </style>
</head>
<body class="shape-circle mirror">
  <div id="frame"><video id="video" autoplay muted playsinline></video><div id="msg"></div></div>
  <div id="resize" data-i18n-title="cam.resize"></div>
  <script src="i18n.js"></script>
  <script src="camera.js"></script>
</body>
</html>
